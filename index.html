<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareMart Shop Manager — Retail Inventory, Sales & Profit System</title>
    <meta
      name="description"
      content="Retail shop management system for baby care, hygiene, and personal care products with sales, inventory, purchases, expenses, profit & loss, analytics, and PDF/Excel reports."
    />
    <meta property="og:title" content="CareMart Shop Manager" />
    <meta
      property="og:description"
      content="Manage daily sales, inventory, supplier purchases, expenses, profit and loss, and business performance in PKR."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f3f8f2" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cm_theme_mode');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.dataset.theme = 'dark';
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0b120d');
          } else {
            document.documentElement.dataset.theme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased selection:bg-lime-500/25 selection:text-lime-900 dark:selection:text-lime-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
